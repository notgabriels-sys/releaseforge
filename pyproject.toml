[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseforge"
version = "0.1.0"
description = "Local-first release proof before distributor upload."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel García Alonso" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.8"]

[project.scripts]
releaseforge = "releaseforge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded offline CSS and HTML are more readable as literal template lines.
"src/releaseforge/report.py" = ["E501"]
"src/releaseforge/compare.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
