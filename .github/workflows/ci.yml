name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Test
        run: uv run --frozen pytest -q

  lint-build-and-smoke:
    name: Lint, build, and installed-artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --frozen ruff check src tests

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests

      - name: Compile package
        run: uv run --frozen python -m compileall -q src

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke installed wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel_path"
          test -n "$sdist_path"

          for artifact in "$wheel_path" "$sdist_path"; do
            artifact_name="$(basename "$artifact")"
            demo_root="${RUNNER_TEMP}/releaseforge-${artifact_name}-demo"
            uv run --isolated --no-project --python 3.11 --with "$artifact" \
              releaseforge demo "$demo_root"
            test -f "$demo_root/START_HERE.md"
            test -f "$demo_root/proof-v1/RELEASE_READINESS.html"
          done
